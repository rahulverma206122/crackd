services:

  client:
    build:
      context: ./client
    container_name: crackd-client
    ports:
      - "5173:80"
    depends_on:
      - server

  server:
    build:
      context: ./server
    container_name: crackd-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8000
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./ai-service
    container_name: crackd-ai
    ports:
      - "8000:8000"
    env_file:
      - ./ai-service/.env
    volumes:
      - crackd-chroma:/app/chroma_data

volumes:
  crackd-chroma: